name: Build installers

# Produces installers you can download and test in a DAW:
#   macOS:   MixCore-<version>-macOS.pkg      (AU for Logic Pro, VST3, standalone app; Apple Silicon + Intel)
#   Windows: MixCore-<version>-Windows-Setup.exe (VST3, standalone app)
#
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0 to
# also publish a GitHub Release with both installers attached.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed only to create the GitHub Release on tags

jobs:
  macos:
    name: "macOS installer (.pkg)"
    runs-on: macos-15  # macos-14 images retire 2 Nov 2026
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(sed -nE 's/^project\(MixCore VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure (universal arm64 + x86_64)
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" 2>&1 | tee configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee build.log

      - name: Test
        # Tests are the strict gate in ci.yml. Here a failing test is reported
        # (yellow warning) but still lets the installer be built for DAW testing.
        id: tests
        continue-on-error: true
        run: ctest --test-dir build -C Release --output-on-failure -LE performance

      - name: List build output (diagnostics)
        if: always()
        run: find build/plugins/mixcore/MixCore_artefacts/Release -maxdepth 3 || true

      - name: Build .pkg
        run: |
          set -o pipefail
          # Run through bash so it works even if the file lost its executable bit
          # (e.g. when the repo was uploaded through the GitHub website).
          bash -x packaging/macos/build_pkg.sh build/plugins/mixcore/MixCore_artefacts/Release \
            "${{ steps.version.outputs.value }}" dist 2>&1 | tee package.log

      - name: Install the .pkg on this runner
        run: |
          sudo installer -pkg "dist/MixCore-${{ steps.version.outputs.value }}-macOS.pkg" -target /
          ls -la /Library/Audio/Plug-Ins/Components/MixCore.component \
                 /Library/Audio/Plug-Ins/VST3/MixCore.vst3 \
                 /Applications/MixCore.app
          lipo -info /Library/Audio/Plug-Ins/Components/MixCore.component/Contents/MacOS/MixCore

      - name: Validate the installed AU with auval (what Logic Pro checks)
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          line="$(auval -a | grep -i mixcore | head -n 1)"
          [ -n "$line" ] || { echo "MixCore not registered with the AU system"; exit 1; }
          echo "Registered: $line"
          # Validate exactly what was installed (type, subtype, manufacturer from auval -a).
          read -r type sub manu _ <<<"$line"
          case "$line" in
            *VineAudio*) ;;
            *) echo "::warning::This build is not branded VineAudio ($line). plugins/mixcore/CMakeLists.txt in the repo is probably an older copy - re-upload it." ;;
          esac
          auval -strict -v "$type" "$sub" "$manu"

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MixCore-macOS-installer
          path: dist/*.pkg
          if-no-files-found: warn

      - name: Upload logs (for diagnosis)
        if: failure() || steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: MixCore-macOS-logs
          path: |
            configure.log
            build.log
            package.log
            build/Testing/Temporary/LastTest*.log
          if-no-files-found: ignore

      - name: Report test failures
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::warning::Some tests failed on macOS - the installer was still built. Download MixCore-macOS-logs and send build/Testing/Temporary/LastTest.log."

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pkg

  windows:
    name: "Windows installer (.exe)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(sed -nE 's/^project\(MixCore VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -LE performance

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            "/DSourceDir=$PWD\build\plugins\mixcore\MixCore_artefacts\Release" `
            "/DOutputDir=$PWD\dist" `
            packaging\windows\MixCore.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MixCore-Windows-installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
